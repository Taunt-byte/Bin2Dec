
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary to Decimal Converter</title>

    <!-- Importa o arquivo de estilos -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Importa o JavaScript após o HTML ser carregado -->
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Binary to Decimal</h1>
        <p>Converta números binários em decimais.</p>

        <label for="binaryInput">Número binário</label>

        <input
            type="text"
            id="binaryInput"
            placeholder="Ex.: 1011"
            inputmode="numeric"
            autocomplete="off"
        >

        <button id="convertButton">Converter</button>

        <section class="result">
            <h2>Resultado</h2>
            <p id="decimalResult" aria-live="polite">
                O resultado aparecerá aqui.
            </p>
        </section>
    </main>
</body>
</html>
